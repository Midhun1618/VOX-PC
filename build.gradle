plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Firebase Admin SDK (brings ALL dependencies automatically)
    implementation 'com.google.firebase:firebase-admin:9.2.0'
}

application {
    mainClass = 'com.voxcom.vox.App'
}
